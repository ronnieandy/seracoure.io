<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Seracoure — Journal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Raleway:wght@300;400;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body { background:#050505; color:#fff; font-family:Poppins,sans-serif; }
    a { color:#c9a46b; text-decoration:none; }

    #header { background:rgba(0,0,0,0.85); padding:10px 0; }
    #header .logo span { color:#c9a46b; }

    .article-hero { padding:140px 0 40px; }
    .eyebrow { color:#c9a46b; font-size:13px; letter-spacing:1.5px; text-transform:uppercase; }
    .article-meta { color:#888; font-size:14px; }
    .article-title { font-size:2.6rem; line-height:1.2; margin:16px 0 24px; }
    .article-hero-img { width:100%; max-height:420px; object-fit:cover; border-radius:12px; border:1px solid #222; margin-bottom:10px; }

    .article-body { max-width:760px; margin:0 auto; padding:20px 0 80px; }
    .article-body p { color:#ddd; font-size:17px; line-height:1.9; margin-bottom:24px; }
    .article-body h3 { color:#fff; margin:40px 0 18px; font-family:Raleway,sans-serif; }

    .back-link { display:inline-flex; align-items:center; gap:8px; margin-bottom:20px; color:#c9a46b; font-size:14px; }

    .related { background:#0c0c0c; border-top:1px solid #222; padding:60px 0; }
    .related h4 { color:#fff; margin-bottom:24px; }
    .related-card { background:#050505; border:1px solid #222; border-radius:12px; overflow:hidden; height:100%; }
    .related-card img { height:150px; object-fit:cover; width:100%; }
    .related-card .body { padding:18px; }
    .related-card h5 { color:#fff; font-size:16px; margin-bottom:8px; }
    .related-card:hover { border-color:#c9a46b; transition:0.3s ease; }

    #footer { background:#000; border-top:1px solid #222; padding:30px 0; }
    #footer p { color:#888; margin:0; font-size:14px; }

    #not-found { padding:160px 0 100px; text-align:center; }
  </style>
</head>

<body>

<header id="header" class="fixed-top">
  <div class="container d-flex justify-content-between align-items-center">
    <h1 class="logo d-flex align-items-center gap-2 mb-0">
      <img src="https://copilot.microsoft.com/th/id/BCO.495e273c-678d-4d46-a6d9-dd213ffa0e94.png" alt="Seracoure Logo" style="height:48px;">
      <span>Sera<span style="color:#c9a46b;">coure</span></span>
    </h1>
    <nav class="navbar">
      <a href="index.html#blog" class="nav-link">Back to Journal</a>
    </nav>
  </div>
</header>

<main id="article-root"></main>

<footer id="footer" class="text-center">
  <div class="container">
    <p>&copy; 2026 Seracoure. All rights reserved.</p>
  </div>
</footer>

<script src="blog-data.js"></script>
<script>
  function getSlug() {
    const params = new URLSearchParams(window.location.search);
    return params.get('post');
  }

  function renderNotFound() {
    document.getElementById('article-root').innerHTML = `
      <div id="not-found" class="container">
        <h2>Post not found</h2>
        <p class="mt-3" style="color:#ccc;">We couldn't find that article. It may have been renamed or removed.</p>
        <a href="index.html#blog" class="btn btn-outline-warning mt-3">Back to the Journal</a>
      </div>
    `;
  }

  function renderArticle(post, allPosts) {
    const bodyHtml = post.body.map(block => {
      if (typeof block === 'string') {
        return `<p>${block}</p>`;
      }
      if (block.heading) {
        return `<h3>${block.heading}</h3>`;
      }
      return '';
    }).join('');

    const related = allPosts.filter(p => p.slug !== post.slug).slice(0, 3);
    const relatedHtml = related.map(p => `
      <div class="col-md-4">
        <a href="blog-post.html?post=${encodeURIComponent(p.slug)}" class="text-decoration-none">
          <div class="related-card">
            <img src="${p.image}" alt="${p.title}">
            <div class="body">
              <div class="eyebrow" style="font-size:11px;">${p.category}</div>
              <h5>${p.title}</h5>
            </div>
          </div>
        </a>
      </div>
    `).join('');

    document.getElementById('article-root').innerHTML = `
      <section class="article-hero">
        <div class="container" style="max-width:820px;">
          <a href="index.html#blog" class="back-link"><i class="bi bi-arrow-left"></i> Back to the Journal</a>
          <div class="eyebrow">${post.category} · ${post.readTime}</div>
          <h1 class="article-title">${post.title}</h1>
          <div class="article-meta mb-4">${post.date}</div>
          <img src="${post.image}" alt="${post.title}" class="article-hero-img">
        </div>
      </section>
      <section class="article-body container">
        ${bodyHtml}
      </section>
      <section class="related">
        <div class="container">
          <h4>More from the Journal</h4>
          <div class="row g-4">${relatedHtml}</div>
        </div>
      </section>
    `;
    document.title = post.title + " — Seracoure Journal";
  }

  const slug = getSlug();
  const post = blogPosts.find(p => p.slug === slug);

  if (post) {
    renderArticle(post, blogPosts);
  } else {
    renderNotFound();
  }
</script>

</body>
</html>
